name: Bug report
description: Report incorrect resolution or package behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input and minimal reproduction
      description: Do not include a real UDID, serial number, IMEI, MEID, or other private identifier.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and supporting sources
    validations:
      required: true
