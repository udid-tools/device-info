name: Catalog watch

on:
  schedule:
    - cron: "37 4 * * 3"
      timezone: Europe/Kyiv
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-watch
  cancel-in-progress: false

jobs:
  discover:
    name: Discover catalog candidates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build library
        run: npm run build

      - name: Discover candidates
        run: >-
          node scripts/discover-catalog-updates.mjs
          --json=catalog-candidates.json
          --markdown=catalog-candidates.md

      - name: Read candidate count
        id: candidates
        shell: bash
        run: |
          set -euo pipefail
          count="$(node --input-type=module --eval="import report from './catalog-candidates.json' with { type: 'json' }; process.stdout.write(String(report.devices.length + report.osBuilds.length));")"
          fingerprint="$(node --input-type=module --eval="import { createHash } from 'node:crypto'; import report from './catalog-candidates.json' with { type: 'json' }; const candidates = { devices: report.devices, osBuilds: report.osBuilds }; process.stdout.write(createHash('sha256').update(JSON.stringify(candidates)).digest('hex'));")"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"

      - name: Create one issue per candidate set
        if: steps.candidates.outputs.count != '0'
        id: issue
        shell: bash
        env:
          CANDIDATE_FINGERPRINT: ${{ steps.candidates.outputs.fingerprint }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          marker="<!-- catalog-fingerprint:${CANDIDATE_FINGERPRINT} -->"
          existing="$(gh issue list --state open --label catalog-update --limit 100 --json number,body --jq ".[] | select((.body // \"\") | contains(\"${marker}\")) | .number" | head -n 1)"
          if [[ -n "${existing}" ]]; then
            echo "number=${existing}" >> "${GITHUB_OUTPUT}"
            echo "created=false" >> "${GITHUB_OUTPUT}"
            assigned="$(gh issue view "${existing}" --json assignees --jq 'any(.assignees[]; .login == "Copilot")')"
            if [[ "${assigned}" == "true" ]]; then
              echo "needs_assignment=false" >> "${GITHUB_OUTPUT}"
            else
              echo "needs_assignment=true" >> "${GITHUB_OUTPUT}"
            fi
          else
            printf '\n%s\n' "${marker}" >> catalog-candidates.md
            number="$(gh issue create --title '[Catalog]: Automated update candidates' --label catalog-update --body-file catalog-candidates.md | sed 's#.*/##')"
            echo "number=${number}" >> "${GITHUB_OUTPUT}"
            echo "created=true" >> "${GITHUB_OUTPUT}"
            echo "needs_assignment=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Assign the catalog task to Copilot when configured
        if: steps.issue.outputs.needs_assignment == 'true' && steps.issue.outputs.number != ''
        shell: bash
        env:
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          if [[ -z "${COPILOT_AGENT_TOKEN}" ]]; then
            echo "::error::COPILOT_AGENT_TOKEN is not configured; the catalog issue requires manual assignment."
            exit 1
          fi
          payload="$(node --input-type=module --eval="process.stdout.write(JSON.stringify({assignees:['copilot-swe-agent[bot]'],agent_assignment:{target_repo:process.env.GITHUB_REPOSITORY,base_branch:'main',custom_instructions:'Use the repository catalog-maintainer instructions. Treat each device identifier/model pair in the issue as a cross-validated structured mapping: verify both linked records, add the exact pair shown, and never infer or substitute adjacent identifiers. Prepare a catalog-only pull request; do not merge, tag, publish, or change workflows.',custom_agent:'',model:''}}));")"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${COPILOT_AGENT_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" \
            --data "${payload}"

      - name: Upload discovery evidence
        if: steps.candidates.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-candidates
          path: |
            catalog-candidates.json
            catalog-candidates.md
          if-no-files-found: error
          retention-days: 14
